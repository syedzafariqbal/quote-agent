[project]
name = "quote-agent"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 125
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["quote_core", "worker", "handlers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/handlers/api.py" = ["E501"]
